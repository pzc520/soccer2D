name: Build and test

on:
  workflow_dispatch:
  push:
    branches: [ "main", "cyrus2d", "dev-pzc" ]
  pull_request:
    branches: [ "main", "cyrus2d", "dev-pzc" ]

permissions:
  contents: read

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build-and-test:
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
    - name: Install Dep
      run: |
        sudo apt-get -o Acquire::Retries=3 update
        sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
          build-essential libboost-system-dev autoconf automake libtool libeigen3-dev zlib1g-dev
    - name: Test intercept prediction
      run: |
        g++ -std=c++17 -Wall -Wextra -pedantic tests/intercept_prediction_test.cpp -o /tmp/intercept_prediction_test
        /tmp/intercept_prediction_test
    - name: Install LibRCSC
      run: |
        git clone https://github.com/helios-base/librcsc.git
        cd librcsc
        git checkout 078d59ff85c336f94c021adac060ef6f2e63c575
        ./bootstrap
        ./configure --prefix="$HOME/.local" --disable-unit-test
        make -j8
        make install
    - name: Install CppDNN headers
      run: |
        git clone https://github.com/Cyrus2D/CppDNN.git
        git -C CppDNN checkout 8cb5a5551e1a950dc60e445a5f73f965aa939bbc
        sudo install -d /usr/local/include/CppDNN
        sudo install -m 644 CppDNN/src/*.h /usr/local/include/CppDNN/
    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build
      # Build your program with the given configuration
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Check player help and shutdown
      run: |
        status=0
        build/bin/sample_player --help > /tmp/soccer2d-player-help.txt 2>&1 || status=$?
        if [ "$status" -ne 1 ] || ! grep -q 'Additional options:' /tmp/soccer2d-player-help.txt; then
          cat /tmp/soccer2d-player-help.txt
          exit 1
        fi
